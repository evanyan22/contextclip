[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextclip"
version = "0.0.1"
description = "A framework-agnostic budget tracker and tail-preserving compaction engine for agent conversation history."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/contextclip"]
